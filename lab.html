<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GONER PACK · OCR LAB</title><link rel="stylesheet" href="style.css">

<body><div id="lab" style="max-width:720px;margin:0 auto;padding:12px 12px 80px">
<div class="top"><a class="ib" href="./" style="text-decoration:none">‹</a><h1>OCR LAB</h1></div>
<div class="bn">Экспериментальная страница сравнения движков. Ничего не сохраняет в заказы и справочник. Фото обрабатывается на телефоне.</div>
<div class="card"><label>Фото чека<input type="file" id="ph" accept="image/*"></label>
<label>Эталон<select id="tr"><option value="">— без эталона (только время и текст) —</option><option>1043264</option><option>1043361</option><option>1043362</option><option>1045046</option><option>1045050</option><option>1045040</option><option>1045035</option><option>1044983</option><option>1045030</option><option>1045026</option><option>1044978</option><option>1044976</option><option>1044953</option><option>1044947</option><option>1044961</option><option>1044917</option><option>1044897</option><option>1044898</option><option>1044888</option><option>1044880</option><option>1044874</option><option value="1042498">1042498 (эталона нет — вставьте ниже)</option><option value="custom">Свой (вставить ниже)</option></select></label>
<label id="ctl" style="display:none">Состав чека: по строке «Название ×N», приборы — «прибор: Палочки ×2»<textarea id="ct" style="min-height:90px"></textarea></label>
<div class="r"><label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="e1" checked style="width:20px;height:20px">Tesseract 012</label><label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="e2" checked style="width:20px;height:20px">Neural 017</label><label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="e3" checked style="width:20px;height:20px">Комбинированный</label></div>
<button class="big" id="go" style="margin-top:10px">Запустить сравнение</button><div class="mu" id="st"></div><div class="bar"><i id="pb" style="width:0%"></i></div></div>
<details class="card"><summary>Диагностика OCR (текст) вместо фото</summary><div class="mu">Вставьте «Скопировать диагностику OCR» из приложения. Будет разобран текст Tesseract (без повторного распознавания).</div><textarea id="dg" style="min-height:90px"></textarea><button class="sm" id="dgo" style="margin-top:8px">Разобрать диагностику</button></details>
<div id="out"></div></div>
